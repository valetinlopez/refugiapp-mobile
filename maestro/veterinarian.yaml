# RFG-85 veterinarian: lectura + clínica, sin escritura operativa.
appId: ${APP_ID}
tags: [e2e, sprint-12, RFG-85]
---
- runFlow:
    file: helpers/login.yaml
    env:
      EMAIL: ${E2E_VET_EMAIL}
      PASSWORD: ${E2E_VET_PASSWORD}
- assertVisible:
    id: dashboard-screen
    timeout: 20000
# Sin acciones de escritura en dashboard para veterinarian
- assertNotVisible: Alta animal
- assertNotVisible: Nueva tarea
- tapOn:
    id: dashboard-animal-row
- assertVisible:
    id: animals-list
    timeout: 15000
- tapOn:
    id: animal-card
- assertVisible: Resumen del animal
# Clínica visible para veterinarian
- tapOn: Evolución clínica
- assertVisible:
    id: clinical-history
# Tareas solo lectura: no hay botón Completar
- tapOn: Tareas
- assertVisible:
    id: task-list
- assertNotVisible:
    id: task-complete
- runFlow: helpers/logout.yaml
