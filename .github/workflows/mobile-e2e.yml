name: Mobile E2E

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'maestro/**'
      - 'src/**'
      - 'app/**'
      - '.github/workflows/mobile-e2e.yml'
  push:
    branches: [develop]
    paths:
      - 'maestro/**'
      - 'src/**'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: maestro per role on staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: app.refugiapp.mobile.staging
      EXPO_PUBLIC_ENV: staging
      EXPO_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Validate Maestro flows syntax
        run: |
          npm exec --yes -- maestro --version 2>/dev/null || true
          node -e "const fs=require('fs');const files=['maestro/admin.yaml','maestro/shelter-manager.yaml','maestro/veterinarian.yaml','maestro/clinical-denied.yaml','maestro/session-expired.yaml','maestro/helpers/login.yaml','maestro/helpers/logout.yaml'];for(const f of files){if(!fs.existsSync(f)){console.error('missing '+f);process.exit(1)}}console.log('maestro flows present')"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Build staging Android APK
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_ENV: staging

      - name: Run Maestro per role
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test maestro --env APP_ID="$APP_ID" --format junit --output maestro-report.xml
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_VET_EMAIL: ${{ secrets.E2E_VET_EMAIL }}
          E2E_VET_PASSWORD: ${{ secrets.E2E_VET_PASSWORD }}

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/screenshots
          if-no-files-found: warn
